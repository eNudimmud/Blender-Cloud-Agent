<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><link rel="manifest" href="/manifest.webmanifest"><title>Blender Cloud Agent</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><div><strong>◈ BLENDER CLOUD</strong><small>Mobile 3D workspace · Technical alpha</small></div><span class="status" id="status">Checking API</span></header><section class="viewer"><div id="canvas" aria-label="3D model viewer"></div><div class="overlay" id="hint">Create a scene to start</div></section><section class="controls"><h1>Create a scene</h1><form id="scene-form"><label for="shape">Object</label><select id="shape"><option value="cube">Cube</option><option value="sphere">Sphere</option><option value="cylinder">Cylinder</option></select><label for="size">Size <output id="size-value">2</output></label><input id="size" type="range" min=".5" max="8" step=".5" value="2"><label for="name">Project name</label><input id="name" maxlength="80" value="My First Scene"><button type="submit" id="generate">Generate scene</button></form><p class="feedback" id="feedback" role="status" aria-live="polite">No GPU or LLM required for this demo.</p><nav id="downloads" hidden><a id="blend-link" download>Download .blend</a><a id="glb-link" download>Download .glb</a><a id="png-link" download>Preview PNG</a></nav></section><footer>Prototype · One scene at a time · Not for public deployment</footer></main><script type="module" src="/static/app.js"></script></body></html>
