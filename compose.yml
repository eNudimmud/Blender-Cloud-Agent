services:
  api:
    image: blender-agent-api:dev
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATA_ROOT: /data
      API_TOKEN: ${API_TOKEN:?Set a random API_TOKEN of at least 32 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AGENT_MODE: ${AGENT_MODE:-rules}
      ALLOW_PAID_AI: ${ALLOW_PAID_AI:-false}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes: [agent-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  worker:
    image: blender-agent-worker:dev
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    environment:
      DATA_ROOT: /data
      JOB_TIMEOUT: 120
    volumes: [agent-data:/data]
    depends_on:
      api:
        condition: service_healthy
volumes:
  agent-data:
