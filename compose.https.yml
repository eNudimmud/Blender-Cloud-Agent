# Single-server HTTPS overlay. Requires Docker Compose 2.24+ for !reset.
services:
  api:
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact HTTPS origin}
      PROXY_SHARED_KEY: ${PROXY_SHARED_KEY:?Set a separate random proxy key}
  proxy:
    image: blender-agent-proxy:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    environment:
      BCA_HOSTNAME: ${BCA_HOSTNAME:?Set the public hostname}
      PROXY_SHARED_KEY: ${PROXY_SHARED_KEY:?Set a separate random proxy key}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/tls.public.caddy:/etc/caddy/tls.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Loopback liveness only; https_smoke.py separately verifies the CA chain.
      test: [CMD-SHELL, 'curl --fail --silent --insecure --connect-to "$${BCA_HOSTNAME}:443:127.0.0.1:8443" "https://$${BCA_HOSTNAME}/health"']
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
volumes:
  caddy-data:
  caddy-config:
